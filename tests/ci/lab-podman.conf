# Installed only on the guarded disposable hosted CI VM.
[Service]
Environment=HOME=%h
Environment=XDG_RUNTIME_DIR=/run/user/%U
UnsetEnvironment=XDG_CONFIG_HOME XDG_DATA_HOME XDG_CACHE_HOME XDG_STATE_HOME
UnsetEnvironment=CONTAINERS_STORAGE_CONF CONTAINERS_CONF CONTAINER_HOST CONTAINER_CONNECTION REGISTRY_AUTH_FILE
