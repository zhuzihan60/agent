# A4Diag runtime directories.
# State is version-independent so upgrades never touch it; only the core and
# its plugin instances may enter these directories (0750, owner a4diag).

d /run/a4diag 0750 a4diag a4diag -
d /var/lib/a4diag 0750 a4diag a4diag -
d /var/lib/a4diag/checkpoints 0750 a4diag a4diag -
d /var/lib/a4diag/transactions 0750 a4diag a4diag -
d /var/lib/a4diag/approvals 0750 a4diag a4diag -
d /var/lib/a4diag/reports 0750 a4diag a4diag -
d /var/lib/a4diag/audit 0750 a4diag a4diag -
d /var/lib/a4diag/plugins 0750 a4diag a4diag -
