- insert:
    - id: mcp-a4diag
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: a4diag
        command: /opt/a4diag/venv/bin/python
        args:
          - -m
          - a4diag.mcp_server
        env:
          A4DIAG_CONFIG: /etc/a4diag/config.yaml
        cwd: /var/lib/a4diag
        toolCallTimeoutMs: 20000
        failOnStartupError: true
