[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a4diag"
version = "0.4.1"
description = "A4 read-only diagnostic MCP service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "mcp==2.0.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
a4diag = "a4diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "live_t11: tests that intentionally exercise the isolated t_11 sandbox",
]
