name: a4diag-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source and run the full suite
        run: |
          python -m pip install -r requirements-build.lock
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps -e packages/a4diag-builtin-plugins
          python tools/build_release.py verify-source --project-root .
          python -m pytest -q -rs

  assemble-and-sign:
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build both wheels from the lockfiles
        run: |
          python -m pip install -r requirements-build.lock
          python -m build --wheel
          python -m build --wheel packages/a4diag-builtin-plugins
      - name: Build verified dependency wheelhouse from the lockfile
        run: |
          python -m pip download -r requirements.lock -d /tmp/a4diag-wheelhouse \
            --no-deps --only-binary=:all: \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux2014_x86_64 \
            --python-version 3.11 --implementation cp --abi cp311
          cd /tmp/a4diag-wheelhouse
          for wheel in *.whl; do sha256sum "$wheel" >> SHA256SUMS; done
      - name: Bind release tag to project version
        run: |
          release_version="$(python -c 'from tools.build_release import RELEASE_VERSION; print(RELEASE_VERSION)')"
          test "$GITHUB_REF_NAME" = "v${release_version}"
      - name: Write the private signing key from repository secret material
        run: |
          printf '%s' "${{ secrets.A4DIAG_RELEASE_PRIVATE_KEY }}" > /tmp/a4diag-release-private.pem
          chmod 0600 /tmp/a4diag-release-private.pem
      - name: Assemble and sign the release
        run: |
          release_version="$(python -c 'from tools.build_release import RELEASE_VERSION; print(RELEASE_VERSION)')"
          python tools/build_release.py assemble \
            --project-root . \
            --dependency-wheelhouse /tmp/a4diag-wheelhouse \
            --core-wheel "dist/a4diag-${release_version}-py3-none-any.whl" \
            --builtin-wheel "packages/a4diag-builtin-plugins/dist/a4diag_builtin_plugins-${release_version}-py3-none-any.whl" \
            --output /tmp/a4diag-release \
            --signing-key /tmp/a4diag-release-private.pem
          python tools/build_release.py verify-release \
            --release-root /tmp/a4diag-release \
            --verification-key release-keys/a4diag-release-public.pem
      - name: Stage stable one-click release assets
        run: |
          mkdir -p /tmp/a4diag-public-assets/archive-root
          cp -a /tmp/a4diag-release /tmp/a4diag-public-assets/archive-root/release
          tar -czf /tmp/a4diag-public-assets/a4diag.tar.gz \
            -C /tmp/a4diag-public-assets/archive-root release
          openssl dgst -sha256 \
            -sign /tmp/a4diag-release-private.pem \
            -out /tmp/a4diag-public-assets/a4diag.tar.gz.sig \
            /tmp/a4diag-public-assets/a4diag.tar.gz
          cp install-a4diag.sh /tmp/a4diag-public-assets/install-a4diag.sh
          cp release-keys/a4diag-release-public.pem \
            /tmp/a4diag-public-assets/a4diag-release-public.pem
          rm -rf /tmp/a4diag-public-assets/archive-root
      - name: Remove the private signing key
        run: rm -f /tmp/a4diag-release-private.pem
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: a4diag-signed-release
          path: /tmp/a4diag-release
          retention-days: 30
      - name: Upload one-click release assets
        uses: actions/upload-artifact@v4
        with:
          name: a4diag-public-assets
          path: /tmp/a4diag-public-assets
          retention-days: 30

  distro-smoke:
    runs-on: ubuntu-latest
    needs: assemble-and-sign
    environment: release
    strategy:
      fail-fast: false
      matrix:
        image:
          - langfarm/alinux3@sha256:c5c67ed6e33dc967e9a05ec3cec680abaf24bc2ea0fb23ee0d1470750882c6b1
          - rockylinux:8
          - rockylinux:9
          - almalinux:8
          - almalinux:9
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Install portable Python 3.11
        run: |
          uv python install 3.11
          python3.11 --version
      - name: Install OpenSSL prerequisite
        shell: bash
        run: |
          if command -v openssl >/dev/null 2>&1; then
            openssl version
            exit 0
          fi
          if command -v dnf >/dev/null 2>&1; then
            dnf -y install openssl
          elif command -v yum >/dev/null 2>&1; then
            yum -y install openssl
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y openssl
          else
            echo "no supported package manager for OpenSSL prerequisite" >&2
            exit 1
          fi
          command -v openssl >/dev/null 2>&1
          openssl version
      - uses: actions/download-artifact@v4
        with:
          name: a4diag-signed-release
          path: /release
      - uses: actions/download-artifact@v4
        with:
          name: a4diag-public-assets
          path: /public-assets
      - name: Stage pinned public verification key
        run: |
          cp release-keys/a4diag-release-public.pem /tmp/a4diag-release-public.pem
          chmod 0644 /tmp/a4diag-release-public.pem
      - name: Distro offline-install smoke on the signed release
        env:
          A4DIAG_TRUSTED_KEY: /tmp/a4diag-release-public.pem
        run: bash tests/integration/distro_smoke.sh
      - name: Reject a tampered public release archive
        run: |
          cp /public-assets/a4diag.tar.gz /tmp/a4diag-tampered.tar.gz
          printf 'tamper\n' >> /tmp/a4diag-tampered.tar.gz
          mkdir -p /tmp/a4diag-tampered-root/opt
          if A4DIAG_RELEASE_URL=file:///tmp/a4diag-tampered.tar.gz \
             A4DIAG_RELEASE_SIGNATURE_URL=file:///public-assets/a4diag.tar.gz.sig \
             A4DIAG_ROOT=/tmp/a4diag-tampered-root/ \
             A4DIAG_SKIP_SYSTEMD=1 A4DIAG_SKIP_DISK=1 \
             bash /public-assets/install-a4diag.sh; then
            echo "bootstrap must reject a tampered archive" >&2
            exit 1
          fi
          test ! -e /tmp/a4diag-tampered-root/opt/a4diag/current
      - name: Public one-click bootstrap smoke
        env:
          A4DIAG_RELEASE_URL: file:///public-assets/a4diag.tar.gz
          A4DIAG_RELEASE_SIGNATURE_URL: file:///public-assets/a4diag.tar.gz.sig
          A4DIAG_ROOT: /tmp/a4diag-bootstrap-root/
          A4DIAG_SKIP_SYSTEMD: "1"
          A4DIAG_SKIP_DISK: "1"
        run: |
          mkdir -p /tmp/a4diag-bootstrap-root/opt
          bash /public-assets/install-a4diag.sh
          test -L /tmp/a4diag-bootstrap-root/opt/a4diag/current

  publish:
    runs-on: ubuntu-latest
    needs: [verify, assemble-and-sign, distro-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: a4diag-public-assets
          path: ${{ runner.temp }}/release-assets
      - name: Verify stable release asset inventory
        run: |
          test -f "$RUNNER_TEMP/release-assets/a4diag.tar.gz"
          test -f "$RUNNER_TEMP/release-assets/a4diag.tar.gz.sig"
          test -f "$RUNNER_TEMP/release-assets/install-a4diag.sh"
          test -f "$RUNNER_TEMP/release-assets/a4diag-release-public.pem"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release-assets/a4diag.tar.gz
            ${{ runner.temp }}/release-assets/a4diag.tar.gz.sig
            ${{ runner.temp }}/release-assets/install-a4diag.sh
            ${{ runner.temp }}/release-assets/a4diag-release-public.pem
