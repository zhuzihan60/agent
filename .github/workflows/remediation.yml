name: a4diag-live-remediation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [systemd-disk, docker, podman, kubernetes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements-build.lock -r requirements.lock
          python -m pip install --no-deps -e . -e packages/a4diag-builtin-plugins -e packages/a4diag-target-runtime
      - name: Install disposable lab prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y e2fsprogs iproute2 uidmap dbus-user-session podman slirp4netns fuse-overlayfs
      - name: Run real signed repair and recovery acceptance (no silent skips)
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            bash tests/ci/run_remediation_linux.sh "$PWD" "$(command -v python)" "$SUITE" "$RUNNER_TEMP/remediation"
      - name: Retain acceptance results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-${{ matrix.suite }}
          path: ${{ runner.temp }}/remediation
          if-no-files-found: error
          retention-days: 14
